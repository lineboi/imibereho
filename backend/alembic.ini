# Alembic is run ONLY through the guarded wrapper:
#     uv run python -m app.db.migrate --target <migrations|test|dev|production> <command> [args]
# This file deliberately holds no database URL. alembic/env.py refuses to run when the wrapper's
# attributes (URL and target) are absent, so a bare `alembic upgrade head` exits with an error.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
