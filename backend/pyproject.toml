[project]
name = "imibereho-backend"
version = "0.2.0"
description = "Imibereho API: illustrative household financial-resilience demo for Rwanda (synthetic data)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
# The formulas use the same notation as docs/architecture/backend-requirements.md.
allowed-confusables = ["−", "×", "–"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]
"app/data/synthetic_households.py" = ["S311"]
"app/data/vulnerability.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts", "alembic"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Request models deliberately use a camelCase alias generator (contract §1).
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --tb=short: long tracebacks print every frame's arguments, which can include database URLs.
addopts = "-ra --strict-markers --tb=short"
markers = [
    "db: needs the guarded PostgreSQL test/migrations databases (TEST_DATABASE_URL, MIGRATIONS_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
