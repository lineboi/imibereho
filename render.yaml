services:
  # FastAPI Backend API Service
  - type: web
    name: imibereho-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | sh && ~/.local/bin/uv sync"
    startCommand: "~/.local/bin/uv run python -m app.db.migrate --target dev upgrade head && ~/.local/bin/uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TARGET
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: imibereho-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

  # React 19 Frontend Static Site
  - type: web
    name: imibereho-app
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: imibereho-db
    region: frankfurt
    plan: free
    databaseName: imibereho
    user: imibereho
